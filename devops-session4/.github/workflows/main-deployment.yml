name: Production Deployment

on:
  push:
    branches: [ main ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Create .env files from secrets
      run: |
        # Create frontend .env file
        mkdir -p frontend
        cat > frontend/.env << EOF
        REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
        REACT_APP_ENVIRONMENT=production
        EOF
        
        # Create backend .env file
        mkdir -p backend
        cat > backend/.env << EOF
        NODE_ENV=production
        PORT=3001
        DATABASE_URL=${{ secrets.DATABASE_URL }}
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        API_KEY=${{ secrets.API_KEY }}
        EOF

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/devops-demo:frontend
          ${{ secrets.DOCKER_USERNAME }}/devops-demo:frontend-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/devops-demo:backend
          ${{ secrets.DOCKER_USERNAME }}/devops-demo:backend-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  trigger-deployment:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
    - name: Trigger local deployment webhook
      run: |
        curl -X POST ${{ secrets.WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d '{
            "ref": "refs/heads/main",
            "repository": {
              "full_name": "${{ github.repository }}"
            },
            "head_commit": {
              "id": "${{ github.sha }}",
              "message": "${{ github.event.head_commit.message }}"
            }
          }' 