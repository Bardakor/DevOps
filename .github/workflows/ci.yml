name: CI Pipeline

# Trigger the workflow on push and pull request events
on:
  push:
    branches: [ main, dev, master ]
  pull_request:
    branches: [ main, dev, master ]

# Allow manual triggering
  workflow_dispatch:

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'devops-session3/package-lock.json'
        
    - name: Install dependencies
      working-directory: devops-session3
      run: npm ci --production=false || npm install
      
    - name: Run linting
      working-directory: devops-session3
      run: npm run lint
      
    - name: Run tests
      working-directory: devops-session3
      run: npm test
      
    - name: Test application startup
      working-directory: devops-session3
      run: |
        timeout 10s npm start &
        sleep 5
        echo "✅ Application started successfully"

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'devops-session3/package-lock.json'
        
    - name: Install dependencies
      working-directory: devops-session3
      run: npm ci --production=false || npm install
      
    - name: Build application
      working-directory: devops-session3
      run: |
        echo "Building application..."
        echo "✅ Build completed successfully"
        
    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: |
          devops-session3/package.json
          devops-session3/index.js
          devops-session3/README.md

  deploy-info:
    name: Deployment Info
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Deployment simulation
      run: |
        echo "🚀 Ready for deployment!"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
        echo "Actor: ${{ github.actor }}"
        echo "✅ All checks passed - application is ready for production!"
